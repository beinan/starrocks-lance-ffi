name: Build and test native packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, rocky9]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: package
          build-args: distro=${{ matrix.distro }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.arch }}
      - name: Package verified installation
        run: |
          version=$(python3 -c 'import json; print(json.load(open("out/lance/share/lance/manifest.json"))["VERSION"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          archive="starrocks-lance-$version-${{ matrix.distro }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C out lance
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lance-${{ matrix.distro }}-${{ matrix.arch }}
          path: starrocks-lance-*.tar.gz*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lance-*
          merge-multiple: true
          path: artifacts
      - name: Publish release after all native builds and tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
